<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="名張市の行事・ごみ・相談窓口を探せる研究用の情報案内。大きな文字でカテゴリから探せます。"><title>情報の編集 | なばり くらしの案内</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23064c70'/%3E%3Cpath d='M7 9h18v3H7zm0 6h18v3H7zm0 6h12v3H7z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><div class="studybar">予備実験用：2026年9月29日の市役所情報10件を固定した旧試作UIです。<a href="/">Flask版の収集情報へ</a></div><header class="masthead"><div class="wrap"><a class="brand" href="index.html">なばり くらしの案内</a></div></header><main class="wrap page"><h1>情報データの編集</h1><p class="notice">研究者・管理担当者用。編集はこのページ上の作業用データに反映します。JSONを書き出し、管理担当者が差し替えるまで、公開中の案内は変わりません。</p><p id="message" class="error" role="status" aria-live="polite"></p><section id="editor" hidden><label for="asof">データ全体の基準日</label> <input type="date" id="asof"><div class="actions"><label>既存JSONを読み込む <input id="import" type="file" accept=".json,application/json"></label></div><label for="records">編集する案内</label> <select id="records"></select><div class="actions"><button id="new" type="button">新しい案内を追加</button><button id="delete" type="button">選択した案内を削除</button></div><form id="form"><div class="form-grid" id="fields"><label>カテゴリ<select id="f-category"></select></label><label class="full">本文（1段落を1行で入力）<textarea id="f-body" rows="6"></textarea></label><label class="full">検索用の言葉（読点で区切る）<input id="f-tags"></label></div><div class="actions"><button type="submit">編集内容を反映</button><button class="primary" id="export" type="button">検証してJSONを書き出す</button></div></form><p>「確認日」は内容を公式ページと照合した日です。自動で今日に更新せず、実際の確認後に入力してください。イベントは開始日・終了日を必ず入力します。削除した情報も元のファイルには残るので、必要なら元のJSONから復旧できます。</p></section><p><a href="about.html">使い方に戻る</a></p></main><script type="module" src="editor.mjs"></script></body></html>
